# Skeleton Model Config - Gemma-4-E4B (DRY Principle)
# =====================================================
# This config follows the skeleton principle: ONLY override model-specific settings.
# It inherits all other settings (paths, processing, quality, etc.) from settings.yaml
#
# Usage with merge:
#   config = load_and_merge_config(
#       base_config="config/settings.yaml",
#       override_config="config/models.gemma4.yaml"
#   )
#
# Or CLI (if your app supports config merging):
#   python -m src.main --config config/settings.yaml --override-config config/models.gemma4.yaml
#
# NOTE: verify the exact Ollama tag with `ollama list` — your settings.yaml has
# both `gemma4-e4b-it:q8_0` and `gemma-4-e4b-it:q8_0`. Use whichever is installed.
# =====================================================

# Model Configuration - ONLY this section is overridden
models:
  provider: "ollama"
  translator: "gemma4-e4b-it:q8_0"
  editor: "gemma4-e4b-it:q8_0"
  refiner: "gemma4-e4b-it:q8_0"
  checker: "gemma4-e4b-it:q8_0"
  ollama_base_url: "http://localhost:11434"
  timeout: 300
  num_ctx: 8192
  use_gpu: true
  gpu_layers: -1

# Pipeline Model Assignments — single_stage = translate only (recommended)
translation_pipeline:
  mode: "single_stage"
  stage1_model: "gemma4-e4b-it:q8_0"
  stage2_model: "gemma4-e4b-it:q8_0"
  reflection_model: "gemma4-e4b-it:q8_0"
  use_reflection: false

# Sampling — gemma-4-e4b runs well at 0.25 (NOT subject to padauk's ≤0.2 ceiling)
processing:
  temperature: 0.25
  top_k: 40
  top_p: 0.95
  repeat_penalty: 1.3
  chunk_size: 1200
  max_retries: 2

# Model Role Router
model_roles:
  translator: ["gemma4-e4b-it:q8_0"]
  refiner: ["gemma4-e4b-it:q8_0"]
  checker: ["gemma4-e4b-it:q8_0"]
  qa_final: ["gemma4-e4b-it:q8_0"]
  glossary_sync: ["gemma4-e4b-it:q8_0"]

# Fast Mode Models (inherits from base when enabled)
fast_config:
  enabled: false
  translator: "gemma4-e4b-it:q8_0"
  editor: "gemma4-e4b-it:q8_0"
  refiner: "gemma4-e4b-it:q8_0"
  checker: "gemma4-e4b-it:q8_0"
