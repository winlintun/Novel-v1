# Sailor2-20B Configuration - Single Stage
# =====================================================
# Single-stage EN→MM translation using sailor2-20b:latest alone.
# 20B parameters (~11 GB VRAM).
#
# ⚠️ NOTE: sailor2-20b:latest is classified as "bad" — untested for
#    Myanmar output quality. The smaller 8B variant failed (35% Myanmar ratio).
#    Checker/QA roles use padauk-gemma:q8_0 for independent quality assessment.
#
# Usage:
#   python -m src.main --novel your-novel --chapter 1 \
#     --config config/settings.sailor2-20b.yaml
# =====================================================

project:
  name: "novel_translation"
  source_language: "en-US"
  target_language: "my-MM"
  novel_genre: "Xianxia/Cultivation"

models:
  provider: "ollama"
  translator: "sailor2-20b:latest"
  editor: "padauk-gemma:q8_0"
  refiner: "padauk-gemma:q8_0"
  checker: "padauk-gemma:q8_0"
  ollama_base_url: "http://localhost:11434"
  timeout: 600
  use_gpu: true
  gpu_layers: -1
  num_ctx: 4096

processing:
  chunk_size: 1500
  temperature: 0.2
  top_k: 50
  top_p: 0.95
  repeat_penalty: 1.2
  max_retries: 3
  request_timeout: 600
  stream: true
  keep_alive: "15m"

translation_pipeline:
  mode: "single_stage"
  stage1_model: "sailor2-20b:latest"
  stage2_model: "padauk-gemma:q8_0"
  reflection_model: "padauk-gemma:q8_0"
  use_reflection: false
  use_fiction_editor: false

paths:
  input_dir: "data/input"
  output_dir: "data/output"
  books_dir: "books"
  glossary_file: "data/glossary_{novel_name}.json"
  context_memory_file: "data/context_memory_{novel_name}.json"
  log_file: "logs/translation.log"
  templates_dir: "templates"

output:
  add_metadata: true
  add_translator_notes: false
  format: markdown
  preserve_formatting: true

myanmar_readability:
  enabled: true
  min_myanmar_ratio: 0.6
  flag_on_fail: true
  block_on_fail: false

qa_testing:
  enabled: true
  auto_retry: true
  markdown_strict: true
  min_myanmar_ratio: 0.6
  fail_on_placeholders: false

model_roles:
  translator: ["sailor2-20b:latest"]
  refiner: ["padauk-gemma:q8_0"]
  checker: ["padauk-gemma:q8_0"]
  glossary_sync: ["padauk-gemma:q8_0"]
  qa_final: ["padauk-gemma:q8_0"]

fast_config:
  enabled: false
