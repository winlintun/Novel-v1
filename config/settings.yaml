fast_config:
  checker: sailor2:8b
  chunk_size: 1200
  editor: padauk-gemma:q8_0
  enabled: false
  num_ctx: 8192
  refiner: padauk-gemma:q8_0
  repeat_penalty: 1.3
  temperature: 0.2
  translator: padauk-gemma:q8_0
model_roles:
  checker:
  - padauk-gemma:q8_0
  glossary_sync:
  - padauk-gemma:q8_0
  qa_final:
  - padauk-gemma:q8_0
  refiner:
  - padauk-gemma:q8_0
  - sailor2-20b
  - yxchia/seallms-v3-7b:Q4_K_M
  translator:
  - padauk-gemma:q8_0
  - gemma4-e4b-it:q8_0
models:
  checker: padauk-gemma:q8_0
  editor: padauk-gemma:q8_0
  gpu_layers: -1
  main_gpu: 0
  num_ctx: 8192
  ollama_base_url: http://localhost:11434
  provider: ollama
  refiner: padauk-gemma:q8_0
  retry_num_predict: 4096
  timeout: 300
  translator: gemma4-e4b-it:q8_0  # change model
  use_gpu: true
  gemma_4_e4b:
    name: gemma-4-e4b-it:q8_0
    temperature: 0.25
    max_tokens: 4096
    chunk_size: 1200
    repeat_penalty: 1.3
    top_k: 40
    top_p: 0.95
  padauk_gemma:
    name: padauk-gemma:q8_0
    temperature: 0.2
    max_tokens: 4096
    chunk_size: 1200
    repeat_penalty: 1.3
myanmar_readability:
  block_on_fail: false
  enabled: true
  flag_on_fail: true
  min_myanmar_ratio: 0.7
output:
  add_metadata: true
  add_translator_notes: false
  format: markdown
  preserve_formatting: true
paths:
  books_dir: books
  context_memory_file: ""   # DB-only — stored in context_snapshots table
  glossary_file: ""         # DB-only — stored in novel_translation.db
  input_dir: data/input
  log_file: logs/translation.log
  output_dir: data/output
  templates_dir: templates
processing:
  chunk_size: 1200
  max_retries: 2
  repeat_penalty: 1.3
  request_timeout: 300
  stream: true
  temperature: 0.35
  top_k: 40
  top_p: 0.95
project:
  name: novel_translation
  novel_genre: Xianxia/Cultivation
  source_language: en-US
  target_language: my-MM
qa_testing:
  auto_retry: false
  enabled: true
  fail_on_placeholders: false
  markdown_strict: true
  min_myanmar_ratio: 0.7
storage:
  backend: sqlite
  db_path: data/novel_translation.db
translation_pipeline:
  description: "Two-stage EN->MM: translategemma:12b translates -> padauk-gemma:q8_0 refines (lite pipeline: Translate -> Refine -> Quality)"
  mode: lite
  mode_description:
    fast: "2-stage pipeline: Translate -> Quality (skip refinement)"
    fast_desc: "Fast optimized: CN->EN->MM pivot with quantized models (16GB RAM)"
    full: "6-stage pipeline: Translate -> Refine -> Reflect -> Quality -> Consistency -> QA"
    lite: "3-stage pipeline: Translate -> Refine -> Quality"
    single_stage: "1-stage pipeline: Direct translation only (RECOMMENDED — full pipeline drops 41-91% of content)"
    two_stage: "2-stage pipeline: Stage 1(gemma-4-e4b) -> Stage 2(padauk-gemma:refinement)"
  use_reflection: true
  use_fiction_editor: false
  stage1_model: gemma4-e4b-it:q8_0
  stage2_model: padauk-gemma:q8_0
  reflection_model: padauk-gemma:q8_0

rag:
  enabled: true
  chroma_path: data/chroma
  db_path: data/novel_v1_dataset.db
  feedback_db: data/novel_v1_dataset.db
  feedback_chroma: data/chroma
  feedback_min_score: 3.0
  feedback_min_myanmar_ratio: 0.70
  top_k: 3
  min_score: 2.5
  min_similarity: 0.3
  novel_filter: null
  # Use the COMPLETE local model dir, not the HF repo id 'BAAI/bge-m3'.
  # The HF cache copy of BAAI/bge-m3 is an interrupted download (weights
  # .incomplete, snapshot has no pytorch_model.bin), so with local_files_only=True
  # it fails to load and RAG silently falls back to SQLite. models/bge-m3 has the
  # full 2.2GB weights and is what the alignment pipeline already uses.
  embedding_model: models/bge-m3
  embedding_device: cpu

# ── Dataset Alignment Pipeline ──────────────────────────────────────────────
# Processes parallel EN/MM chapter files → creates aligned sentence pairs → populates RAG DB
alignment_pipeline:
  source_lang: "en"
  target_lang: "my"
  input_dir: "data/input"
  output_dir: "data/output"
  paths:
    db_dir: "data"
    cache_dir: "data/cache/alignment"
    reports_dir: "data/reports/alignment"
    chroma_dir: "data/chroma"
  embedding:
    model: "models/bge-m3"
    device: "cpu"
    batch_size: 32
  llm_judge:
    enabled: true
    provider: "ollama"
    model: "padauk-gemma:q8_0"
    sample_rate: 0.05
