fast_config:
  checker: sailor2:8b
  chunk_size: 1200
  editor: padauk-gemma:q8_0
  enabled: false
  num_ctx: 8192
  refiner: padauk-gemma:q8_0
  repeat_penalty: 1.3
  temperature: 0.2
  translator: padauk-gemma:q8_0
model_roles:
  checker:
  - padauk-gemma:q8_0
  glossary_sync:
  - padauk-gemma:q8_0
  qa_final:
  - padauk-gemma:q8_0
  refiner:
  - padauk-gemma:q8_0
  - sailor2-20b
  - yxchia/seallms-v3-7b:Q4_K_M
  translator:
  - padauk-gemma:q8_0
  - gemma4-e4b-it:q8_0
models:
  checker: padauk-gemma:q8_0
  editor: padauk-gemma:q8_0
  gpu_layers: -1
  main_gpu: 0
  num_ctx: 8192  # must exceed largest assembled prompt (system+glossary+context+chunk); 8192 was too small for 14B models
  ollama_base_url: http://localhost:11434
  provider: ollama
  refiner: padauk-gemma:q8_0
  retry_num_predict: 4096
  # Big models (14-20B) overflow the ~7GB Vulkan VRAM and get split onto CPU,
  # dropping generation to ~1-3 tok/s. 600s timed them out mid-chunk (empty
  # output). 1800s lets a CPU-split chunk finish — at the cost of 10-25 min/chunk.
  timeout: 1800
  translator: translategemma-simple:latest  # change model
  use_gpu: true
  gemma_4_e4b:
    name: gemma-4-e4b-it:q8_0
    temperature: 0.25
    max_tokens: 4096
    chunk_size: 1200
    repeat_penalty: 1.3
    top_k: 40
    top_p: 0.95
  padauk_gemma:
    name: padauk-gemma:q8_0
    temperature: 0.2
    max_tokens: 4096
    chunk_size: 800
    repeat_penalty: 1.5
myanmar_readability:
  block_on_fail: false
  enabled: true
  flag_on_fail: true
  min_myanmar_ratio: 0.7
output:
  add_metadata: true
  add_translator_notes: false
  format: markdown
  preserve_formatting: true
  # Scene-aware register normalization: rewrites colloquial markers (ရဲ့→၏,
  # အဲဒီ→ထို) in NARRATION only; dialogue stays colloquial. Matches the literary
  # register of the human corpus for xianxia/wuxia.
  literary_narration: true
paths:
  books_dir: books
  context_memory_file: ""   # DB-only — stored in context_snapshots table
  glossary_file: ""         # DB-only — stored in novel_translation.db
  input_dir: data/input
  log_file: logs/translation.log
  output_dir: data/output
  templates_dir: templates
processing:
  chunk_size: 1200
  chunk_timeout: 3600  # per-chunk wall-clock cap; must exceed request_timeout (= 2*timeout) so a slow CPU-split big model isn't killed early
  max_retries: 2
  repeat_penalty: 1.3
  request_timeout: 1800
  stream: true
  temperature: 0.3
  top_k: 40
  top_p: 0.95
project:
  name: novel_translation
  novel_genre: Xianxia/Cultivation
  source_language: en-US
  target_language: my-MM
qa_testing:
  auto_retry: false
  enabled: true
  fail_on_placeholders: false
  markdown_strict: true
  min_myanmar_ratio: 0.7
storage:
  backend: sqlite
  db_path: data/novel_translation.db
translation_pipeline:
  description: "EN->MM single-stage direct translation (RECOMMENDED: refine/reflect stages drop 41-91% of content). To change model: python scripts/change_model.py"
  mode: single_stage
  mode_description:
    fast: "2-stage pipeline: Translate -> Quality (skip refinement)"
    fast_desc: "Fast optimized: CN->EN->MM pivot with quantized models (16GB RAM)"
    full: "6-stage pipeline: Translate -> Refine -> Reflect -> Quality -> Consistency -> QA"
    lite: "3-stage pipeline: Translate -> Refine -> Quality"
    single_stage: "1-stage pipeline: Direct translation only (RECOMMENDED — full pipeline drops 41-91% of content)"
    two_stage: "2-stage pipeline: Stage 1(gemma-4-e4b) -> Stage 2(padauk-gemma:refinement)"
  use_reflection: false
  use_fiction_editor: false
  use_syntax_editor: false
  use_adequacy_gate: true
  # What to do when a chunk's BGE-M3 adequacy score < adequacy_min_score:
  #   warn  — record only (score shown in report/logs)
  #   retry — re-translate up to adequacy_max_retries, keep the best-scoring
  #           candidate (strictly a quality win; never aborts a run)
  #   block — retry, then reject a still-low chunk (not checkpointed, counts
  #           toward the 3-consecutive-failure early abort)
  adequacy_action: retry
  adequacy_min_score: 0.45
  adequacy_max_retries: 1
  syntax_editor_model: models/mig-burmese-llm
  syntax_editor_device: auto
  stage1_model: gemma4-e4b-it:q8_0
  stage2_model: padauk-gemma:q8_0
  reflection_model: padauk-gemma:q8_0

rag:
  enabled: true
  chroma_path: data/chroma
  # Paragraph-level index (tools/reindex_rag_paragraphs.py) — matches translation
  # chunk granularity, unlike the sentence-level 'alignment_pairs' whose cosine
  # similarity collapsed to ~0.1 against paragraph queries. Falls back to
  # 'alignment_pairs' automatically if this collection is absent.
  collection: alignment_paragraphs
  db_path: data/novel_v1_dataset.db
  feedback_db: data/novel_v1_dataset.db
  feedback_chroma: data/chroma
  feedback_min_score: 3.0
  feedback_min_myanmar_ratio: 0.70
  # BGE-M3 cross-lingual adequacy gate for feedback ingestion (F2). Pairs with
  # adequacy below this are rejected even if the fluency heuristic passes —
  # prevents meaning-incomplete pairs (dropped sentences, hallucinations) from
  # polluting the RAG corpus. 0.45 matches the per-chunk adequacy threshold.
  min_adequacy: 0.45
  top_k: 3            # 3 few-shot examples (5 crowded the 8B model's prompt and
                      # hurt overall coherence); still selected from a larger pool,
                      # balanced dialogue+descriptive, compression-biased
  min_score: 2.5
  min_similarity: 0.3
  # Drop retrieved examples whose source is a near-exact match for the text being
  # translated (cosine >= this). Prevents self-reference leakage when the chapter
  # being translated is itself in the RAG corpus. Set >= 1.0 to disable.
  max_similarity: 0.97
  novel_filter: null
  # Use the COMPLETE local model dir, not the HF repo id 'BAAI/bge-m3'.
  # The HF cache copy of BAAI/bge-m3 is an interrupted download (weights
  # .incomplete, snapshot has no pytorch_model.bin), so with local_files_only=True
  # it fails to load and RAG silently falls back to SQLite. models/bge-m3 has the
  # full 2.2GB weights and is what the alignment pipeline already uses.
  embedding_model: models/bge-m3
  embedding_device: cpu

# ── QE Re-ranking (best-of-N) ───────────────────────────────────────────────
# Sample multiple candidate translations per chunk and keep the best one under a
# reference-free quality estimator (fluency + hard-defect penalties: placeholders,
# leakage, truncation, degenerate loops, length deficiency). The single biggest
# quality lever for a stochastic local model — but it multiplies generation cost
# by num_candidates, so it is OFF by default. Candidates differ only by sampling
# SEED (temperature is left at its Myanmar-safe value), so quality is preserved.
rerank:
  enabled: false
  num_candidates: 3   # candidates sampled per chunk when enabled (2–4 is sensible)
  seed_base: 1234     # candidate i uses seed_base + i (reproducible)

# ── Dataset Alignment Pipeline ──────────────────────────────────────────────
# Processes parallel EN/MM chapter files → creates aligned sentence pairs → populates RAG DB
alignment_pipeline:
  source_lang: "en"
  target_lang: "my"
  input_dir: "data/input"
  output_dir: "data/output"
  paths:
    db_dir: "data"
    cache_dir: "data/cache/alignment"
    reports_dir: "data/reports/alignment"
    chroma_dir: "data/chroma"
  embedding:
    model: "models/bge-m3"
    device: "cpu"
    batch_size: 32
  llm_judge:
    enabled: true
    provider: "ollama"
    model: "padauk-gemma:q8_0"
    sample_rate: 0.05

# ── Alignment noise rules (folded from former config/rule.yaml) ──────────────
# Used by the dataset-alignment preprocessing/validators to strip noise and
# reject forbidden scripts from target (Myanmar) text.
alignment_rules:
  noise_patterns:
    translator_notes:
      - "\\(T/?N[:.][^)]*\\)"
      - "\\[Translator[''']s Note[^\\]]*\\]"
      - "TL Note:.*"
      - "\\[TN:.*?\\]"
    ads:
      - "(?i)visit\\s+\\S+\\.(com|net|org)"
      - "(?i)support\\s+(us|me)\\s+on\\s+(patreon|ko-fi)"
      - "(?i)read\\s+ahead\\s+at\\s+\\S+"
      - "(?i)discord\\.(gg|com)/\\S+"
    formatting_artifacts:
      - "_{3,}"
      - "-{4,}"
      - "={4,}"
      - "\\*{3,}"
    ocr_errors:
      - "\\b[Il1]{3,}\\b"
      - "\\brnm\\b"
      - "\\bth[ei]s\\b"
  forbidden_scripts_in_target:
    - bengali:    "[\\u0980-\\u09FF]+"
    - devanagari: "[\\u0900-\\u097F]+"
    - thai:       "[\\u0E00-\\u0E7F]+"
    - khmer:      "[\\u1780-\\u17FF]+"
    - tamil:      "[\\u0B80-\\u0BFF]+"
    - chinese:    "[\\u4E00-\\u9FFF]{2,}"

# ── LoRA fine-tuning config (folded from former src/training/config_lora.yaml) ─
# Used by src/training/finetune.py.
lora_training:
  lora:
    r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    target_modules:
      - "q_proj"
      - "v_proj"
      - "k_proj"
      - "o_proj"
    bias: "none"
    task_type: "CAUSAL_LM"
  training:
    per_device_train_batch_size: 4
    gradient_accumulation_steps: 2
    learning_rate: 2.0e-4
    num_train_epochs: 3
    warmup_steps: 50
    logging_steps: 10
    save_steps: 0
    evaluation_strategy: "epoch"
    save_strategy: "epoch"
    load_best_model_at_end: true
    metric_for_best_model: "eval_loss"
    greater_is_better: false
    fp16: false
    bf16: false
    dataloader_num_workers: 2
  quantization:
    load_in_4bit: true
    bnb_4bit_compute_dtype: "float16"
    bnb_4bit_quant_type: "nf4"
  dataset:
    min_human_score: 3
    min_auto_score: 4
    test_split: 0.1
    val_split: 0.1
    max_train_samples: 10000
  model:
    ollama_model_name: "padauk-gemma:q8_0"
    hf_model_name: "google/gemma-2b"
    adapter_dir: "models/adapters"

