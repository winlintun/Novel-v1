fast_config:
  checker: sailor2:8b
  chunk_size: 1200
  editor: padauk-gemma:q8_0
  enabled: false
  num_ctx: 4096
  refiner: padauk-gemma:q8_0
  repeat_penalty: 1.3
  temperature: 0.2
  translator: padauk-gemma:q8_0
model_roles:
  checker:
  - gemma-4-e4b-it:q8_0
  glossary_sync:
  - gemma-4-e4b-it:q8_0
  qa_final:
  - gemma-4-e4b-it:q8_0
  refiner:
  - padauk-gemma:q8_0
  - sailor2-20b
  - yxchia/seallms-v3-7b:Q4_K_M
  translator:
  - padauk-gemma:q8_0
  - translategemma:12b
models:
  checker: padauk-gemma:q8_0
  editor: padauk-gemma:q8_0
  gpu_layers: -1
  main_gpu: 0
  num_ctx: 4096
  ollama_base_url: http://localhost:11434
  provider: ollama
  refiner: padauk-gemma:q8_0
  timeout: 300
  translator: gemma-4-e4b-it:q8_0
  use_gpu: true
  gemma_4_e4b:
    name: gemma-4-e4b-it:q8_0
    temperature: 0.25
    max_tokens: 4096
    chunk_size: 2500
    repeat_penalty: 1.3
    top_k: 40
    top_p: 0.95
  padauk_gemma:
    name: padauk-gemma:q8_0
    temperature: 0.2
    max_tokens: 4096
    chunk_size: 2500
    repeat_penalty: 1.3
myanmar_readability:
  block_on_fail: false
  enabled: true
  flag_on_fail: true
  min_myanmar_ratio: 0.7
output:
  add_metadata: true
  add_translator_notes: false
  format: markdown
  preserve_formatting: true
paths:
  books_dir: books
  context_memory_file: data/context_memory_{novel_name}.json
  glossary_file: data/glossary_{novel_name}.json
  input_dir: data/input
  log_file: logs/translation.log
  output_dir: data/output
  templates_dir: templates
processing:
  chunk_size: 2500
  max_retries: 2
  repeat_penalty: 1.3
  request_timeout: 300
  stream: true
  temperature: 0.25
  top_k: 40
  top_p: 0.95
project:
  name: novel_translation
  novel_genre: Xianxia/Cultivation
  source_language: en-US
  target_language: my-MM
qa_testing:
  auto_retry: false
  enabled: true
  fail_on_placeholders: false
  markdown_strict: true
  min_myanmar_ratio: 0.7
storage:
  backend: sqlite
  db_path: data/novel_translation.db
translation_pipeline:
  description: "Two-stage EN->MM: Stage 1(gemma-4-e4b-it) -> Stage 2(padauk-gemma)"
  mode: two_stage
  mode_description:
    fast: "2-stage pipeline: Translate -> Quality (skip refinement)"
    fast_desc: "Fast optimized: CN->EN->MM pivot with quantized models (16GB RAM)"
    full: "6-stage pipeline: Translate -> Refine -> Reflect -> Quality -> Consistency -> QA"
    lite: "3-stage pipeline: Translate -> Refine -> Quality"
    single_stage: "1-stage pipeline: Direct translation only"
    two_stage: "2-stage pipeline: Stage 1(gemma-4-e4b) -> Stage 2(padauk-gemma:refinement)"
  use_reflection: false
  stage1_model: gemma-4-e4b-it:q8_0
  stage2_model: padauk-gemma:q8_0
  reflection_model: padauk-gemma:q8_0

rag:
  enabled: true
  chroma_path: data/chroma_db
  db_path: data/novel_v1_dataset.db
  feedback_db: data/novel_v1_dataset.db
  feedback_chroma: data/chroma_db
  feedback_min_score: 3.0
  feedback_min_myanmar_ratio: 0.70
  top_k: 3
  min_similarity: 0.3
  novel_filter: null
