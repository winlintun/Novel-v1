# Noise patterns for Dataset Alignment Pipeline
# These patterns are used by validators/noise.py and preprocessing.py

noise_patterns:
  translator_notes:
    - "\\(T/?N[:.][^)]*\\)"
    - "\\[Translator[''']s Note[^\\]]*\\]"
    - "TL Note:.*"
    - "\\[TN:.*?\\]"

  ads:
    - "(?i)visit\\s+\\S+\\.(com|net|org)"
    - "(?i)support\\s+(us|me)\\s+on\\s+(patreon|ko-fi)"
    - "(?i)read\\s+ahead\\s+at\\s+\\S+"
    - "(?i)discord\\.(gg|com)/\\S+"

  formatting_artifacts:
    - "_{3,}"
    - "-{4,}"
    - "={4,}"
    - "\\*{3,}"

  ocr_errors:
    - "\\b[Il1]{3,}\\b"
    - "\\brnm\\b"
    - "\\bth[ei]s\\b"

forbidden_scripts_in_target:
  - bengali:    "[\\u0980-\\u09FF]+"
  - devanagari: "[\\u0900-\\u097F]+"
  - thai:       "[\\u0E00-\\u0E7F]+"
  - khmer:      "[\\u1780-\\u17FF]+"
  - tamil:      "[\\u0B80-\\u0BFF]+"
  - chinese:    "[\\u4E00-\\u9FFF]{2,}"
