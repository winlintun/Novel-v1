# Hybrid Translation Configuration
# =================================
# Stage 1: translategemma:12b (Translation)
# Stage 2+: padauk-gemma:q8_0 (Refinement, Reflection, Quality, Consistency)
#
# This hybrid approach:
# - Uses translategemma:12b for initial translation (faster)
# - Uses padauk-gemma:q8_0 for refinement (better literary quality)
# - Expected quality: ~80-85% (vs 91% for pure padauk-gemma)
#
# Usage:
#   python -m src.main \
#     --novel your-novel \
#     --chapter 1 \
#     --config config/settings.yaml \
#     --override-config config/models.hybrid.yaml

# Model Configuration - HYBRID
models:
  provider: "ollama"
  translator: "gemma-4-e4b-it:q8_0"     # Stage 1: Translation
  editor: "padauk-gemma:q8_0"          # Stage 2: Refinement
  refiner: "padauk-gemma:q8_0"         # Stage 2: Refinement
  checker: "padauk-gemma:q8_0"         # Stage 4+: Quality/Consistency
  ollama_base_url: "http://localhost:11434"
  timeout: 300
  num_ctx: 4096
  use_gpu: true
  gpu_layers: -1

# Processing Parameters
processing:
  temperature: 0.2        # For padauk-gemma refinement (must be ≤ 0.2)
  repeat_penalty: 1.3
  max_retries: 2
  chunk_size: 2500

# Pipeline Configuration
translation_pipeline:
  mode: "full"            # Enable all stages
  stage1_model: "translategemma:12b"
  stage2_model: "padauk-gemma:q8_0"
  reflection_model: "padauk-gemma:q8_0"
  use_reflection: true
  
  # Optional: Custom prompt for translategemma Stage 1
  # stage1_system_prompt: |
  #   You are a translator. Translate English to Myanmar.
  #   [Your custom instructions here]

# Model Role Assignments
model_roles:
  translator: ["translategemma:12b"]
  refiner: ["padauk-gemma:q8_0"]
  checker: ["padauk-gemma:q8_0"]
  qa_final: ["padauk-gemma:q8_0"]
  glossary_sync: ["padauk-gemma:q8_0"]

# Quality Gates
qa_testing:
  enabled: true
  auto_retry: false
  markdown_strict: true
  min_myanmar_ratio: 0.7
  fail_on_placeholders: false

myanmar_readability:
  enabled: true
  min_myanmar_ratio: 0.7
  block_on_fail: false
  flag_on_fail: true

# Fast Mode (disabled by default)
fast_config:
  enabled: false
  translator: "translategemma:12b"
  editor: "padauk-gemma:q8_0"
  refiner: "padauk-gemma:q8_0"
  checker: "padauk-gemma:q8_0"
  temperature: 0.2
  repeat_penalty: 1.3
  chunk_size: 1200
  num_ctx: 4096
